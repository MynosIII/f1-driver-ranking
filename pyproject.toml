[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "historical-xw"
version = "0.1.0"
description = "Historical Formula 1 driver-car-team win attribution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0", "pandas>=2.2,<3", "polars>=1.0", "scipy>=1.13",
  "scikit-learn>=1.5", "statsmodels>=0.14", "pydantic>=2.8",
  "pydantic-settings>=2.4", "duckdb>=1.1", "pyarrow>=17", "fastf1>=3.4",
  "httpx>=0.27", "requests>=2.32", "pyyaml>=6", "tenacity>=9",
  "matplotlib>=3.9", "plotly>=5", "jinja2>=3.1", "rich>=13", "typer>=0.12"
]

[project.optional-dependencies]
sources = ["fastf1>=3.4", "httpx>=0.27"]
model = ["scikit-learn>=1.5", "statsmodels>=0.14"]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
xw = "historical_xw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/historical_xw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
